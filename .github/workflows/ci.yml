name: Validate
on:
  push:
  pull_request:
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PersistentWorkflows.slnx
      - run: dotnet test PersistentWorkflows.slnx --no-restore --configuration Release
      - run: dotnet pack PersistentWorkflows.slnx --no-restore --configuration Release --output artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*
  sql-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          $env:PERSISTENTWORKFLOWS_TEST_SQLSERVER = 'Server=(localdb)\MSSQLLocalDB;Database=master;Trusted_Connection=True;TrustServerCertificate=True;'
          dotnet test PersistentWorkflows.slnx --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack PersistentWorkflows.slnx --no-restore --configuration Release --output artifacts/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore validation/PackageConsumer --configfile validation/PackageConsumer/NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project validation/PackageConsumer --no-restore --configuration Release
