name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PersistentWorkflows.slnx
      - run: dotnet test PersistentWorkflows.slnx --no-restore --configuration Release --logger trx --results-directory artifacts/test-results
      - run: dotnet pack PersistentWorkflows.slnx --no-restore --configuration Release --output artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-test-results
          path: artifacts/test-results/*
  sql-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          $env:PERSISTENTWORKFLOWS_TEST_SQLSERVER = 'Server=(localdb)\MSSQLLocalDB;Database=master;Trusted_Connection=True;TrustServerCertificate=True;'
          dotnet test PersistentWorkflows.slnx --configuration Release --logger trx --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack PersistentWorkflows.slnx --no-restore --configuration Release --output artifacts/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./validation/Inspect-Packages.ps1
          dotnet restore validation/PackageConsumer --configfile validation/PackageConsumer/NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project validation/PackageConsumer --no-restore --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-server-validation
          path: |
            artifacts/test-results/*
            artifacts/packages/*
            artifacts/stable-release/package-manifest.json
